id: x-handoff-e2e
family: 交接审计
why: >
  `docs/handoff-audit.md` 的**实证 case**（用户 2026-11-03 指定"同时备课+导学单"）：
  一趟真实对话把主链路上的交接点**走一遍** ——
  两个技能**同轮**派发（各自要问 2 个问题 → 待答 / 试答 / 台账 / 透传 / 投递都压到），
  再基于**已交付的产物**改一版（refs / 可读产物清单 / 执行器读产物），
  最后让主 agent 读一次产物正文（隔离的反面：读了就一直在）。
realism: 用户指定的实测任务
tier: audit
skills_dir: evals/skills
skills_mode: replace
turns:
  - "帮我备课，三年级数学《分数的初步认识》，再出一份配套的导学单"
  - "第一课时，上法用探究发现型"
  - "学生基础一般；导学单课前预习用，填空补白形式"
  - "导学单再改一版，环节要和教案对得上，参考一下教案"
  - "把教案的完整内容发我看看"
checks:
  - check: no_exception
soft:
  - check: no_repeat_question
    fields: ["年级", "课时", "课题"]
