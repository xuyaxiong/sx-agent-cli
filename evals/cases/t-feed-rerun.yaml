id: t-feed-rerun
family: 交接审计
why: >
  外审 F5 的**实证 case**：投递那条路的「**试答后重跑**」。

  它是两条路里**唯一**在 `render_briefing` 之前**没落账**的那条 —— 于是重跑那份交接书里
  「它最后说的那句」是**上一轮**的（`delegate` 那条路是先落账的，两条路**漂了**）。
  全库历史 trace / `_run.md` **零命中**：这条路从来没被真跑到过，所以专门造一个。

  怎么逼出来（每一步都是结构条件，不靠碰运气）：
    ① 技能 `guided-learning` 的 SKILL.md 写着「**必须**向用户提问，**一次只问一个**，
       拿到答复再问下一个，共 2 个问题」→ 第 1 轮派发后它只问第 1 问（使用场景）；
    ② 用户**只答第 1 问**（`answer_to` 点名那条）→ `_feed_waiting` 定向投递 → 重入执行器；
    ③ 执行器接着问第 2 问（填写形式）→ 这一趟仍是 `waiting_for_input`；
    ④ 平台强制**主 agent 试答** —— 而第 2 问的答案**就在第 1 轮的用户原话里**
       （"填空补白"），所以它答得上 → **重跑**（`try_answer_then_rerun` 的第二次 `run_task`）。

  **要看的就一件事**：重跑那份交接书里「它最后说的那句」是**这一趟**的（执行器问第 2 问时
  说的那段话），不是上一趟的。修之前是上一趟的（`tmp/probe_feed_rerun_briefing.py`
  在单测层面复现过）。

  ✅ **2026-11-06 实测到了**（`runs/f5-rerun-verify/…__r2`）：重跑那趟的
  「它最后说的那句」= 投递那趟问第 2 问时说的那段（逐字对上），修前会是第 1 问那段。

  ⚠️ **第 ④ 步是模型相关的，别指望每次都走到**（两遍各走了一种结局，两种都对）：
  执行器接着问的那句如果是"**确认你刚说的**"，主 agent 答得上 → 重跑；
  如果是"**你偏好哪个**"，它答不上 → 问题透传给用户 ✓。
  所以这个 case 断的是**析取**（`no_lost_question`），不押"一定走到重跑" ——
  那条路**确定性的**覆盖在 `unit_feed_waiting` ⑧（假模型，必然走到）。
realism: 用户"一次答一个"的真实节奏（`docs/scenarios.md` 记过这个形状）
tier: audit
skills_dir: evals/skills
skills_mode: replace
# 🔴 **强制走委派那条路**（`proto/agent.EXEC_PATH`）：本 case 验的就是**执行器**那条链路，
#    而"派不派"是模型的自由选择 —— 实测 r1 它先 `read_skill` 就收尾了（没建 Task），
#    于是第 2 轮点名的待答不存在、运行器按"case 写错了"把整轮毙掉。
#    **要验哪条路就开哪条**，不靠碰运气（用户 2026-11-02 定的）。
exec_path: delegate
turns:
  # 只给**形式**（不给用途）—— 形式那句留给主 agent 在第 ④ 步答
  - "帮我做一份人教版三年级语文《荷花》的导学单，学生边读边用填空补白的形式填写。"
  # 只答第 1 问（使用场景）
  - {text: "课前预习用。", answer_to: "@waiting:guided-learning"}
checks:
  - check: no_exception
  # 投递那条路**必须**被走到（机制断言，稳）：答复是平台投的，不是主 agent 重派
  - check: platform_fed_answer
  # 🔴 **断析取**：走到重跑（completed）与答不上（透传给用户）**两种结局都对** ——
  #    押哪一种都会 flaky（实测两遍各走了一种）。见 `checks.check_no_lost_question`。
  - check: no_lost_question
