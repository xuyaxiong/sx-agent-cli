id: s01-multi-skill-dedup
family: 痛点
why: "P1 —— 用户已经说过的信息不该再问一遍（跨技能去重）"
realism: 文档记录的需求
tier: smoke
turns:
  - "帮我备课、导学单，再出个随堂小测，三年级数学"
# ⚠️ 断言必须**与路径无关**。实测发现主 agent 有两条路都满足 P1：
#   ① 先问用户收齐再派发（Task=0）  ② 直接派发、执行器缺什么再汇总问
#   原来断言 `task_count: 3` 只认 ②，把 ① 判成了失败 —— 那是**实现细节**，不是需求。
#   真正要守的是「不重复问」和「不重复派」。
checks:
  - check: missing_excludes
    words: ["年级", "学科"]
  # 只在走了委派路径时有意义；没派发就自动过（那条路由下面的软断言守）
  - check: all_tasks_given_contain
    subs: ["三年级", "数学"]
  - check: delegate_calls_max
    n: 3
  - check: reply_nonempty
soft:
  # 中文子串必然误伤（「三年级」含「年级」），只能语义判
  - check: no_repeat_question
    fields: ["年级", "学科"]
