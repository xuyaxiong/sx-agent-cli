id: s07-no-store-delivery
family: 交付形态
why: "用户指出的真实业务场景：配置块是给调用方解析的，不落库、只能以正文输出 —— 曾把「完成 = 产物库非空」这条判定打翻"
realism: 实测发生过
tier: smoke
# 🔴 **平台造路**（2026-11-02）：这条压的是**执行器的正文交付形态**，可它原来的断言
# `task_stages` 断的是"**主 agent 会不会委派**" —— 那是模型的自由选择，于是必然脆：
# 实测三次跑批 `baseline 2/3` · `s07-flaky 1/3` · `split-verify 0/1`，
# 失败那次是主 agent 觉得"课件配置很简单"，**自己写了个块**直接回复（没建 Task）。
# 开 `delegate` 之后，"走委派"由**工具集**保证，断言重新落在机制上。
exec_path: delegate
turns:
  - "帮我生成一份三年级数学《分数的初步认识》的课件配置，6 页"
checks:
  - check: task_stages
    stages: {courseware-config: completed}
  # 不落库
  - check: artifact_count
    n: 0
  # 配置块要原样转达给用户
  - check: reply_contains
    subs: ["slides"]
  - check: no_finalize_rescue
