id: s07-no-artifact-task
family: 交付形态
why: >
  **任务本来就不需要文件产物**时，判定不能把"产物库是空的"当成"没完成"。
  曾经把「完成 = 产物库非空」这条判定打翻过（S7，2026-10-28）——
  现在的判定问的是「**任务完成了没**」，产物只是**证据之一**。

  ⚠️ **原来的这条 case 叫 `s07-no-store-delivery`，壳是"正文交付"** ——
  那个形态**平台不保证、且是反模式**（用户 2026-11-03：
  *"我们平台根本就不保证正文交付这条路径……因为正文交付就是反模式"*）。
  所以换掉壳、**保留性质**：不再验"配置块原样转达"（平台不保证），
  只验"**无产物的任务照样能判完成、且不放行只说不做的**"。
realism: 实测发生过（S7 循环版实测失败 → 修复）
tier: smoke
# 🔴 **平台造路**（2026-11-02）：可它原来的断言 `task_stages` 断的是
# "**主 agent 会不会委派**" —— 那是模型的自由选择，于是必然脆：
# 实测三次跑批 `baseline 2/3` · `s07-flaky 1/3` · `split-verify 0/1`，
# 失败那次是主 agent 觉得"这活很简单"，**自己干了**（没建 Task）。
# 开 `delegate` 之后，"走委派"由**工具集**保证，断言重新落在机制上。
exec_path: delegate
skills:
  - name: lesson-review
    description: 教案点评：读一份教案，给出口头修改建议（**纯分析，不产出文件**）
    instructions: |
      读一遍派给你的教案内容，给出口头的修改建议：好在哪、哪里要改、怎么改。
      **这是纯分析任务，不需要产出任何文件** —— 建议直接写在你的回复里。
      任务里会给教案内容；**只有内容确实太简略、评不了时才问**，不要自己编一份来点评。
turns:
  # ⚠️ 任务里要**给全**（否则执行器会正确地追问"教案全文"，这条 case 就压不到"无产物也能完成"）
  - |
    帮我点评一下这份教案，直接说建议就行，不用出文件。

    课题：分数的初步认识（三年级，第一课时）
    教学目标：1. 认识几分之一，会读会写；2. 通过折纸理解"平均分"；3. 感受分数与生活的联系。
    重难点：重点是理解平均分；难点是理解"分的份数越多，每份越小"。
    教学过程：
      一、导入（5 分钟）：分月饼情境，引出"一半怎么写"。
      二、新授（20 分钟）：折纸认识 1/2 → 读写法 → 折纸认识 1/4 → 比较 1/2 和 1/4 的大小。
      三、练习（10 分钟）：三道填空题。
      四、小结（5 分钟）：回顾今天学了什么。
    板书设计：中间写课题，左侧贴折纸作品，右侧写 1/2、1/4 的读写法。
    作业：回家把一块蛋糕平均分给家人，说说每人分到几分之一。
checks:
  - check: task_stages
    stages: {lesson-review: completed}
  # 不落库 —— 而且**不该因此判没完成**
  - check: artifact_count
    n: 0
  # 成果在执行器的话里（平台不保证这条路径，只保证"判得对"）
  - check: reply_nonempty
  - check: no_finalize_rescue
