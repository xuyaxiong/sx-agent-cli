id: e11-fault-injection
family: 异常
why: "DashScope 偶发 grammar 超时，**一次抖动曾炸掉整个 turn**。兜底加了但从没在注入下测过"
realism: 实测发生过
tier: full
fault:
  structured: 2      # 让第 1 次结构化调用的**两次尝试都失败** → 走保守默认值
turns:
  # ⚠️ **第 1 轮不写「难度」**：`quiz` 技能的指令是 *"你需要知道「难度」…不知道就先问"* ——
  #    缺了它，执行器**有机会**提问（信息给全了，它就没得问）。
  - "帮我出个随堂小测，三年级数学《分数的初步认识》"
  # 第 2 轮把缺的那项补上 → 投递重跑 → 交付
  - "难度基础"
# 🔴 **这条 case 天生只能"压到就压到"**（2026-11-05 实测确认，**不是 bug**）：
#    注入打的是 `safe_structured`（结构化调用）—— 而它**只有一条路可达**：
#    执行器主动提问 → 平台强制试答（`_ask_main`）→ 结构化调用。
#    `delegate` 与投递**两条路都是** `if outcome.status == "waiting_for_input"` 才走试答，
#    **没有平台造的路**。所以"这次提问了没有"是**模型的自由选择** ✗ ——
#    而按判据，有效性不该押在它身上。
#    **`fault_fired` 偶尔红 = 它在说真话**（这次没压到那条路），不是产品坏了。
#    实测：7 次里 1 次没触发。见到红先看这条，别去查兜底 —— 兜底没坏。
#    （真要根治，得给结构化调用造一条平台路 —— 那是**新机制**，没被咬到之前不造。）
checks:
  - check: fault_fired
  - check: no_exception
  # 抖动之后还得把活干完（结构化调用退化到保守默认 → 登记待答 → 用户答复 → 交付成功）
  - check: task_stages
    stages: {quiz: completed}
