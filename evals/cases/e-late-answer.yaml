id: e-late-answer
family: 多轮
why: >
  待答挂了 2 轮才被回答。**这条同时是 F7 的回归**：
  改之前，主 agent 会在第 1 轮就自己编一个「难度：基础」重新委派、跳过用户（50% 概率）；
  改之后，待答由平台投递和透传，主 agent 只该委派一次。
realism: 实测发生过
tier: full
turns:
  - "帮我出个随堂小测，人教版三年级数学《分数的初步认识》第一课时"
  - "对了，我们班这周讲到哪了来着？"
  - "难度要基础的"
checks:
  # 第 1 轮：执行器缺「难度」→ 登记待答
  - check: task_stages
    at: 1
    stages: {quiz: waiting_for_input}
  # 🔴 F7 核心：平台必须**自己**把问题透传给用户，不许主 agent 编一个答案糊过去
  - check: platform_relayed
    at: 1
  # 中间那轮换了话题、没回答 → 待答不能丢
  - check: task_stages
    at: 2
    stages: {quiz: waiting_for_input}
  # 🔴 待答的解除走**平台投递**，不是主 agent 重新委派
  - check: platform_fed_answer
    at: 3
  - check: task_stages
    stages: {quiz: completed}
  - check: no_task_stage
    stages: {quiz: [waiting_for_input, superseded]}
  # 🔴 主 agent 全程只该委派 1 次（第 1 轮）。多于 1 次 = 它在重派 = F7 复发
  - check: delegate_calls_max
    n: 1
