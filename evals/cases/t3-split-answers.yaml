id: t3-split-answers
family: 真实技能
why: >
  执行器一次问一个、用户一次答一个 —— **历次答复必须累积**（F15）。
  预置答复若一句话把两问都答了，恰好绕开它（首轮脚本化跑批就是这么漏掉的），
  所以这条故意把答复拆到两轮。
realism: 实测发生过（2026-10-29 人在环，用户当场发现"同一个问题问两遍"）
tier: smoke
skills_mode: replace
# ⚠️ 第二版：第一版技能产出只要"200 字简短说明"，主 agent 用 `read_skill` 读完原文后
# **判断"我自己也能干"，第 3 轮直接 `write_artifact` 把活做了**，一次都没派发。
# 这条 case 要压的是**重入**，所以把技能做成"一眼就该委派"的形态：
# 产出长（600+ 字、结构完整）+ 名字像专业能力。
# （"主 agent 读了 skill 原文就自己干"这个副作用另记，见 docs/discussion-log.md）
skills:
  - name: product-brief
    description: 产品说明撰写：产出结构完整的产品说明文档（写入产物库）
    instructions: |
      产出一份**结构完整的产品说明**，写入产物库（write_artifact，正文不少于 600 字）。
      必须包含：产品定位、核心功能、使用场景、目标用户、与同类产品的差异。

      **你必须依次确认两件事，一次只问一个，拿到答复再问下一个**：
      1. 先说：「你希望什么风格？」（简洁 / 详细 / 活泼）
      2. 拿到答复后，再问：「篇幅多长？」（半页 / 一页）

      **两个都拿到之前不要动笔**。缺哪个问哪个，不要自己编一个默认值。
# 🔴 **平台造路**（2026-11-02）：直接注入一个"等用户答复"的 Task，
# 于是"**答复投递（重入）**"那条路径**从第 1 轮起就必然被走到** ——
# 不用再指望"执行器先问一轮"（那是模型的自由选择）。
#
# 为什么改成这样：原来靠 `run_task_count_over: 3` 判"有没有压到重入路径"，
# 实测两臂**逐字相同地都挂这一条** —— 主 agent 自己在第 2、3 轮把信息收齐了才派发，
# 执行器**一次就干完**，那条路径压根没被走到。**有效性不该押在模型的自由选择上。**
# 判据见 `evals/checks.py` 顶部。
initial_tasks:
  - id: t-injected
    skill: product-brief
    task: 为「智学笔」撰写一份产品说明
    stage: waiting_for_input          # ← 关键：一上来就是"等用户答复"
    artifacts: []
    refs: []
    report: 你希望这份产品说明是什么风格？（简洁 / 详细 / 活泼）
    # 🔴 **它申报要的那句原话**（`ask_user` 的参数）—— 2026-11-05 加：
    #    透传（`node_finalize`）现在**从对象渲染**（贴这句，不贴上面那段 `report` 独白）✓
    #    注入的 Task 得带上它，否则走的是"没留下问题原话"那条降级路 —— 和真实路径对不上。
    asked: 你希望这份产品说明是什么风格？（简洁 / 详细 / 活泼）
    # ⚠️ 2026-11-05：原来这里还有 `progress` / `missing`（判定吐的）和 `based_on: [1]`
    #    （点名轮次）—— 三样都没有来源了（判定退休 / 点名 2026-11-03 取消），
    #    留着只会被**静默忽略**（注入时原样塞进 state，没人读）。`unit_handoff` ⑬+ 守着这条。
    # 🔴 问答**成对**（2026-11-02）：它问的那句 ＋ 答复，一条记录
    qa: []
    agent_tried: false
    # 用户第 1 轮的原话（平台硬搬进交接书的那份快照）—— 注入的 Task 也得带上，
    # 否则交接书里缺【用户原话】段，和真实路径对不上
    user_turns:
      - n: 1
        text: 帮我写一份产品说明。产品：智学笔，一支能实时翻译的智能笔，面向学生和家长。

turns:
  # 用户**一次答一个** —— 每次答复都**定向**投给那个待答 Task（重入）。
  # ⚠️ 注入的 Task ID 是写死的（`t-injected`），所以这里直接点名 ——
  #    比 `@waiting` 更稳（§0.65 Y1：标识由通道填，平台不猜"你在答谁"）
  - {text: "风格要简洁", answer_to: "t-injected"}
  - {text: "篇幅一页", answer_to: "t-injected"}
checks:
  - check: task_stages
    stages: {product-brief: completed}
  - check: every_task_has_artifact
  # 🔴 **断平台行为**（不是模型行为）：平台有没有把用户答复投给待答任务。
  # 它替代了原来那条脆的 `run_task_count_over` —— 那条断的是"模型会不会重入"。
  - check: platform_fed_answer
soft:
  # 用户在轮 2 已经答过风格，再问就是 F15 复发
  - check: no_repeat_question
    fields: ["风格"]
