id: t3-split-answers
family: 真实技能
why: >
  执行器一次问一个、用户一次答一个 —— **历次答复必须累积**（F15）。
  预置答复若一句话把两问都答了，恰好绕开它（首轮脚本化跑批就是这么漏掉的），
  所以这条故意把答复拆到两轮。
realism: 实测发生过（2026-10-29 人在环，用户当场发现"同一个问题问两遍"）
tier: smoke
skills_mode: replace
# ⚠️ 第二版：第一版技能产出只要"200 字简短说明"，主 agent 用 `read_skill` 读完原文后
# **判断"我自己也能干"，第 3 轮直接 `write_artifact` 把活做了**，一次都没派发。
# 这条 case 要压的是**重入**，所以把技能做成"一眼就该委派"的形态：
# 产出长（600+ 字、结构完整）+ 名字像专业能力。
# （"主 agent 读了 skill 原文就自己干"这个副作用另记，见 docs/discussion-log.md）
skills:
  - name: product-brief
    description: 产品说明撰写：产出结构完整的产品说明文档（写入产物库）
    instructions: |
      产出一份**结构完整的产品说明**，写入产物库（write_artifact，正文不少于 600 字）。
      必须包含：产品定位、核心功能、使用场景、目标用户、与同类产品的差异。

      **你必须依次确认两件事，一次只问一个，拿到答复再问下一个**：
      1. 先说：「你希望什么风格？」（简洁 / 详细 / 活泼）
      2. 拿到答复后，再问：「篇幅多长？」（半页 / 一页）

      **两个都拿到之前不要动笔**。缺哪个问哪个，不要自己编一个默认值。
turns:
  # ⚠️ 首轮**必须给足信息**：第一版只写"帮我写一份产品说明"，主 agent 判断"没法动手"，
  # 三轮都在自己问用户"产品叫什么"、**一次都没派发**（F3 那条路径）——
  # 这条 case 要压的是**重入**，不是"主 agent 会不会派发"，所以把前提给全。
  - "帮我写一份产品说明。产品：智学笔，一支能实时翻译的智能笔，面向学生和家长。"
  - "风格要简洁"
  - "篇幅一页"
checks:
  - check: task_stages
    stages: {product-brief: completed}
  - check: every_task_has_artifact
  # 🔬 **有效性断言**：它必须真的分了两次问。
  # 若执行器一上来把两问一起问了，就只有 1 次 run_task —— 这条回归**没被触发**，
  # 上面那两条绿了也不算数（这是 `artifact_writes_multithreaded` 那一类断言的用法）。
  - check: run_task_count_over
    skill: product-brief
    n: 3
soft:
  # 用户在轮 2 已经答过风格，再问就是 F15 复发
  - check: no_repeat_question
    fields: ["风格"]
