<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1560 1250" width="1560" height="1250" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5F6368"/>
    </marker>
    <marker id="mO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#EF6C00"/>
    </marker>
    <marker id="mG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2E7D32"/>
    </marker>
    <marker id="mB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1565C0"/>
    </marker>
  </defs>

  <rect width="1560" height="1250" fill="#FFFFFF"/>
  <text x="780" y="38" text-anchor="middle" font-size="24" font-weight="700" fill="#202124">消息传递 —— 谁把什么交给谁（13 跳，逐跳列出交接内容）</text>
  <text x="780" y="63" text-anchor="middle" font-size="12.5" fill="#5F6368">一次 graph.invoke ＝ 一轮；不是网络调用，是同进程里的函数调用与状态更新　｜　每跳下面那张卡 ＝ 这一跳实际交接的内容</text>

  <!-- 阶段图例 -->
  <rect x="60" y="80" width="1420" height="28" rx="6" fill="#FAFAFA" stroke="#E0E0E0"/>
  <circle cx="80" cy="94" r="5" fill="#5F6368"/>
  <text x="92" y="99" font-size="11.5" fill="#5F6368">首次派发（①–⑤）</text>
  <circle cx="262" cy="94" r="5" fill="#EF6C00"/>
  <text x="274" y="99" font-size="11.5" fill="#EF6C00">出口限制循环（⑥–⑧，最多 3 轮）</text>
  <circle cx="560" cy="94" r="5" fill="#2E7D32"/>
  <text x="572" y="99" font-size="11.5" fill="#2E7D32">试答与登记（⑨–⑪）</text>
  <circle cx="760" cy="94" r="5" fill="#1565C0"/>
  <text x="772" y="99" font-size="11.5" fill="#1565C0">跨轮：答复投递（⑫，发生在<tspan font-weight="600">下一次 invoke</tspan>）</text>
  <text x="1100" y="99" font-size="11.5" fill="#757575">⑬ 并进 ⑩ 的同一条 ToolMessage　｜　虚线 ＝ 返回值</text>

  <!-- ═══════ 生命线 ═══════ -->
  <line x1="130" y1="180" x2="130" y2="1160" stroke="#BDBDBD" stroke-width="1.2" stroke-dasharray="5 5"/>
  <line x1="400" y1="180" x2="400" y2="1160" stroke="#BDBDBD" stroke-width="1.2" stroke-dasharray="5 5"/>
  <line x1="760" y1="180" x2="760" y2="1160" stroke="#BDBDBD" stroke-width="1.2" stroke-dasharray="5 5"/>
  <line x1="1090" y1="180" x2="1090" y2="1160" stroke="#BDBDBD" stroke-width="1.2" stroke-dasharray="5 5"/>
  <line x1="1310" y1="180" x2="1310" y2="1160" stroke="#BDBDBD" stroke-width="1.2" stroke-dasharray="5 5"/>

  <rect x="60" y="124" width="140" height="56" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.8"/>
  <text x="130" y="148" text-anchor="middle" font-size="13" font-weight="700" fill="#174EA6">用户</text>
  <text x="130" y="166" text-anchor="middle" font-size="9.5" fill="#1565C0">HumanMessage</text>

  <rect x="300" y="124" width="200" height="56" rx="8" fill="#FFF8F0" stroke="#FB8C00" stroke-width="2" stroke-dasharray="7 4"/>
  <text x="400" y="148" text-anchor="middle" font-size="13" font-weight="700" fill="#E65100">主 agent 🧠</text>
  <text x="400" y="166" text-anchor="middle" font-size="9.5" fill="#8D6E63">完整 agent，有自己的工具与上下文</text>

  <rect x="640" y="124" width="240" height="56" rx="8" fill="#E8F5E9" stroke="#43A047" stroke-width="2"/>
  <text x="760" y="148" text-anchor="middle" font-size="13" font-weight="700" fill="#1B5E20">平台代码 🔒</text>
  <text x="760" y="166" text-anchor="middle" font-size="9.5" fill="#2E7D32">prepare · finalize · delegate 工具体</text>

  <rect x="990" y="124" width="200" height="56" rx="8" fill="#E0F7FA" stroke="#00838F" stroke-width="2"/>
  <text x="1090" y="148" text-anchor="middle" font-size="13" font-weight="700" fill="#006064">执行器 🧠</text>
  <text x="1090" y="166" text-anchor="middle" font-size="9.5" fill="#00838F">隔离上下文 · <tspan font-weight="600">用完即弃</tspan></text>

  <rect x="1240" y="124" width="140" height="56" rx="8" fill="#F3E5F5" stroke="#8E24AA" stroke-width="1.8"/>
  <text x="1310" y="148" text-anchor="middle" font-size="13" font-weight="700" fill="#4A148C">判定 🧠</text>
  <text x="1310" y="166" text-anchor="middle" font-size="9.5" fill="#6A1B9A">结构化调用，无工具</text>

  <rect x="1400" y="124" width="140" height="1036" rx="10" fill="#FFFDE7" stroke="#FBC02D" stroke-width="1.4" stroke-dasharray="6 4"/>
  <text x="1470" y="150" text-anchor="middle" font-size="12" font-weight="700" fill="#F57F17">产物库</text>
  <text x="1470" y="168" text-anchor="middle" font-size="9.5" fill="#8D6E63">跨轮活着</text>
  <text x="1470" y="558" text-anchor="middle" font-size="9.5" fill="#5F6368">art_001</text>
  <text x="1470" y="574" text-anchor="middle" font-size="9.5" fill="#5F6368">art_002</text>
  <text x="1470" y="590" text-anchor="middle" font-size="9.5" fill="#5F6368">…</text>
  <text x="1470" y="1104" text-anchor="middle" font-size="9.5" fill="#8D6E63">执行器弃，</text>
  <text x="1470" y="1120" text-anchor="middle" font-size="9.5" fill="#8D6E63">它不弃</text>

  <!-- ═══════════ ① ═══════════ -->
  <line x1="130" y1="200" x2="396" y2="200" stroke="#5F6368" stroke-width="1.8" marker-end="url(#m)"/>
  <text x="265" y="192" text-anchor="middle" font-size="11"><tspan font-weight="700" fill="#5F6368">① 用户输入</tspan><tspan fill="#9AA0A6"> · HumanMessage · 用户 → 图</tspan></text>
  <rect x="130" y="208" width="270" height="26" rx="5" fill="#F8F9FA" stroke="#E0E0E0"/>
  <text x="140" y="225" font-size="9.5" fill="#616161">原话（不加工），进 state.messages</text>

  <!-- ═══════════ ② ═══════════ -->
  <line x1="760" y1="280" x2="404" y2="280" stroke="#5F6368" stroke-width="1.8" marker-end="url(#m)"/>
  <text x="580" y="272" text-anchor="middle" font-size="11"><tspan font-weight="700" fill="#5F6368">② 台账注入</tspan><tspan fill="#9AA0A6"> · SystemMessage · 平台 → 主 agent</tspan></text>
  <rect x="400" y="288" width="360" height="47" rx="5" fill="#F8F9FA" stroke="#E0E0E0"/>
  <text x="410" y="303" font-size="9.5" fill="#616161">【平台提示】你已委派出去的工作（共 N 项）：</text>
  <text x="410" y="315" font-size="9.5" fill="#616161">- {id}「{skill}」{状态标记}{→ 产物 ID}　｜　待答/失败另给细节</text>
  <text x="410" y="327" font-size="9.5" fill="#616161">已做到・还缺・执行器说　（tasks 空 → 整段不注入）</text>

  <!-- ═══════════ ③ ═══════════ -->
  <line x1="400" y1="368" x2="756" y2="368" stroke="#5F6368" stroke-width="1.8" marker-end="url(#m)"/>
  <text x="580" y="360" text-anchor="middle" font-size="11"><tspan font-weight="700" fill="#5F6368">③ 派发</tspan><tspan fill="#9AA0A6"> · tool_call 参数 · 主 agent → 平台</tspan></text>
  <rect x="400" y="376" width="360" height="35" rx="5" fill="#F8F9FA" stroke="#E0E0E0"/>
  <text x="410" y="391" font-size="9.5" fill="#616161">skill_name ・ task ・ artifacts[] ・ based_on_turns[]</text>
  <text x="410" y="403" font-size="9.5" fill="#616161">技能名 / 产物 ID / 轮次 不存在 → 当场拒绝，<tspan font-weight="600">不建 Task</tspan></text>

  <!-- ═══════════ ④ ═══════════ -->
  <line x1="760" y1="456" x2="1086" y2="456" stroke="#5F6368" stroke-width="2.2" marker-end="url(#m)"/>
  <text x="923" y="448" text-anchor="middle" font-size="11"><tspan font-weight="700" fill="#5F6368">④ 交接书</tspan><tspan fill="#9AA0A6"> · HumanMessage · 平台 → 执行器（所有重入路径的唯一入口）</tspan></text>
  <rect x="480" y="464" width="610" height="47" rx="5" fill="#F8F9FA" stroke="#E0E0E0"/>
  <text x="490" y="479" font-size="9.5" fill="#616161">【任务】（<tspan font-weight="600">主 agent 交代的</tspan>）・【用户原话】（<tspan font-weight="600">用户说的</tspan>・平台硬搬：清单常驻、全文按需）</text>
  <text x="490" y="491" font-size="9.5" fill="#616161">【你上次说到哪】（判定说已做到/还缺 ・ 你上次说）・【已经答复过的信息】（用户：… ／ 主 agent 补充：…）</text>
  <text x="490" y="503" font-size="9.5" fill="#616161">【已经产出的产物】・【可读产物】・【续跑提示】　—— 7 段按条件出现，<tspan font-weight="600">每段都标来源</tspan></text>

  <!-- ═══════════ ⑤ ═══════════ -->
  <line x1="1090" y1="536" x2="1396" y2="536" stroke="#5F6368" stroke-width="1.8" marker-end="url(#m)"/>
  <text x="1243" y="528" text-anchor="middle" font-size="11"><tspan font-weight="700" fill="#5F6368">⑤ 落产物</tspan><tspan fill="#9AA0A6"> · write_artifact → ARTIFACTS ＋ 磁盘</tspan></text>
  <rect x="1050" y="544" width="340" height="35" rx="5" fill="#F8F9FA" stroke="#E0E0E0"/>
  <text x="1060" y="559" font-size="9.5" fill="#616161">7 字段：title/summary/content/type/ext/file/path</text>
  <text x="1060" y="571" font-size="9.5" fill="#616161">正文<tspan font-weight="600">不进</tspan>主 agent 上下文 —— 它是跨轮唯一的载体</text>

  <!-- ═══════════ ⑥ ═══════════ -->
  <line x1="1090" y1="616" x2="1306" y2="616" stroke="#EF6C00" stroke-width="2" marker-end="url(#mO)"/>
  <text x="1198" y="608" text-anchor="middle" font-size="11"><tspan font-weight="700" fill="#EF6C00">⑥ 判定输入</tspan><tspan fill="#9AA0A6"> · 结构化 prompt</tspan></text>
  <rect x="1050" y="624" width="340" height="47" rx="5" fill="#FFF8F0" stroke="#FFCC80"/>
  <text x="1060" y="639" font-size="9.5" fill="#8D6E63">【任务要求】skill.instructions</text>
  <text x="1060" y="651" font-size="9.5" fill="#8D6E63">【执行者已经拿到的信息】＝整份交接书（④）</text>
  <text x="1060" y="663" font-size="9.5" fill="#8D6E63">【实际执行结果】产物正文（无产物 → 全部 AI 产出）</text>

  <!-- ═══════════ ⑦ ═══════════ -->
  <line x1="1310" y1="696" x2="1094" y2="696" stroke="#EF6C00" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#mO)"/>
  <text x="1202" y="688" text-anchor="middle" font-size="11"><tspan font-weight="700" fill="#EF6C00">⑦ 判定结果</tspan><tspan fill="#9AA0A6"> · _Judgement · 判定 → 平台</tspan></text>
  <rect x="1050" y="704" width="340" height="35" rx="5" fill="#FFF8F0" stroke="#FFCC80"/>
  <text x="1060" y="719" font-size="9.5" fill="#8D6E63">status ・ progress ・ missing[] ・ reason</text>
  <text x="1060" y="731" font-size="9.5" fill="#8D6E63">判定是<tspan font-weight="600">第三方评审</tspan>，可能判错 —— 交接书里它的话标「判定说」</text>

  <!-- ═══════════ ⑧ ═══════════ -->
  <line x1="760" y1="776" x2="1086" y2="776" stroke="#EF6C00" stroke-width="2" marker-end="url(#mO)"/>
  <text x="923" y="768" text-anchor="middle" font-size="11"><tspan font-weight="700" fill="#EF6C00">⑧ 推回去</tspan><tspan fill="#9AA0A6"> · HumanMessage（追加）· 平台 → 执行器</tspan></text>
  <rect x="760" y="784" width="330" height="47" rx="5" fill="#FFF8F0" stroke="#FFCC80"/>
  <text x="770" y="799" font-size="9.5" fill="#8D6E63">任务还没完成。／<tspan font-weight="600">你已经完成了</tspan>：{progress}</text>
  <text x="770" y="811" font-size="9.5" fill="#8D6E63">／<tspan font-weight="600">还缺</tspan>：{missing}／请接着往下做，不要从头再来</text>
  <text x="770" y="823" font-size="9.5" fill="#8D6E63">↺ 循环 ≤3 轮（MAX_REACT_ROUNDS）→ 仍 incomplete 判 failed</text>

  <!-- ═══════════ ⑨ ═══════════ -->
  <line x1="760" y1="856" x2="404" y2="856" stroke="#2E7D32" stroke-width="2" marker-end="url(#mG)"/>
  <text x="580" y="848" text-anchor="middle" font-size="11"><tspan font-weight="700" fill="#2E7D32">⑨ 试答</tspan><tspan fill="#9AA0A6"> · 结构化 prompt · 平台 → 主 agent（强制的一步）</tspan></text>
  <rect x="400" y="864" width="360" height="35" rx="5" fill="#F1F8E9" stroke="#C5E1A5"/>
  <text x="410" y="879" font-size="9.5" fill="#33691E">能力 ・ 你交给它的任务 ・ 执行器说 ・【已做到】【还缺】・最近 10 条消息</text>
  <text x="410" y="891" font-size="9.5" fill="#33691E">问：你的上下文里有没有它需要的信息？有 → 原话照搬；没有 → <tspan font-weight="600">不要编造</tspan></text>

  <!-- ═══════════ ⑩ ═══════════ -->
  <line x1="760" y1="936" x2="404" y2="936" stroke="#2E7D32" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#mG)"/>
  <text x="580" y="928" text-anchor="middle" font-size="11"><tspan font-weight="700" fill="#2E7D32">⑩ 工具返回</tspan><tspan fill="#9AA0A6"> · ToolMessage · 七个可达出口</tspan></text>
  <rect x="400" y="944" width="360" height="35" rx="5" fill="#F1F8E9" stroke="#C5E1A5"/>
  <text x="410" y="959" font-size="9.5" fill="#33691E">①技能不存在 ②产物 ID 不存在（不建 Task）③已交付＋<tspan font-weight="600">⑬附注</tspan></text>
  <text x="410" y="971" font-size="9.5" fill="#33691E">art_001 → &lt;真实路径&gt;　④成果在回复里 ⑤试答后完成 ⑥还在等 ⑦failed</text>

  <!-- ═══════════ ⑪ ═══════════ -->
  <line x1="760" y1="1016" x2="134" y2="1016" stroke="#2E7D32" stroke-width="2.2" marker-end="url(#mG)"/>
  <text x="447" y="1008" text-anchor="middle" font-size="11"><tspan font-weight="700" fill="#2E7D32">⑪ 待答透传</tspan><tspan fill="#9AA0A6"> · AIMessage · 平台 → 用户（无条件）</tspan></text>
  <rect x="130" y="1024" width="630" height="35" rx="5" fill="#F1F8E9" stroke="#C5E1A5"/>
  <text x="140" y="1039" font-size="9.5" fill="#33691E">有待答就原样贴，<tspan font-weight="600">不判断主 agent 问没问</tspan>（原来是 LLM 判断，两头都会错 —— 已删）</text>
  <text x="140" y="1051" font-size="9.5" fill="#33691E">平台只保证<tspan font-weight="600">产物</tspan>这一种交付物；正文交付不保证、也不造机制兜底（solution.md §0.7）</text>

  <!-- 跨轮分隔 -->
  <line x1="60" y1="1074" x2="1380" y2="1074" stroke="#1565C0" stroke-width="1.4" stroke-dasharray="10 6"/>
  <text x="70" y="1070" font-size="10.5" font-weight="700" fill="#1565C0">⟵ 这一次 invoke 到此结束（回复已给用户）　｜　下一次 invoke 开始（用户答复进来了）⟶</text>

  <!-- ═══════════ ⑫ ═══════════ -->
  <line x1="760" y1="1104" x2="1086" y2="1104" stroke="#1565C0" stroke-width="2.2" marker-end="url(#mB)"/>
  <text x="923" y="1096" text-anchor="middle" font-size="11"><tspan font-weight="700" fill="#1565C0">⑫ 答复投递</tspan><tspan fill="#9AA0A6"> · HumanMessage · 下一次 invoke 的 prepare</tspan></text>
  <rect x="760" y="1112" width="330" height="35" rx="5" fill="#E3F2FD" stroke="#90CAF9"/>
  <text x="770" y="1127" font-size="9.5" fill="#0D47A1">原话投给<tspan font-weight="600">所有</tspan> stage=waiting_for_input 的 Task</text>
  <text x="770" y="1139" font-size="9.5" fill="#0D47A1">answers 累积不覆盖；不判断「是不是在回答」→ 交接书重放</text>

  <!-- 底注 -->
  <rect x="60" y="1176" width="1420" height="56" rx="10" fill="#F1F8E9" stroke="#7CB342" stroke-width="1.4"/>
  <text x="80" y="1198" font-size="11.5" font-weight="700" fill="#33691E">🔑 两条不变量 —— 看懂这两条就看懂了这个架构：</text>
  <text x="80" y="1218" font-size="11.5" fill="#558B2F">① <tspan font-weight="600">执行器用完即弃</tspan> → 任何一次重入（试答后重跑 ⑧／答复投递 ⑫）都必须由平台<tspan font-weight="600">重放整份交接书</tspan>（④），不能只带增量　② <tspan font-weight="600">平台保证的交付物只有产物</tspan>，其余走大多数 agent 的搞法，不自己造机制</text>
</svg>
