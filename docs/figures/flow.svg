<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 760" width="1400" height="760" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5F6368"/>
    </marker>
    <marker id="aO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#EF6C00"/>
    </marker>
    <marker id="aG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2E7D32"/>
    </marker>
    <marker id="aB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1565C0"/>
    </marker>
  </defs>

  <rect width="1400" height="760" fill="#FFFFFF"/>
  <text x="700" y="38" text-anchor="middle" font-size="24" font-weight="700" fill="#202124">关键流程 —— 主干、三态分派、「待答」的一生</text>
  <text x="700" y="63" text-anchor="middle" font-size="12.5" fill="#5F6368">上排：一次 invoke 的主干　｜　下排：执行器缺信息时问题怎么走完一圈（含跨轮）　｜　〔〕＝ 这一跳交接了什么</text>

  <!-- 图例 -->
  <rect x="70" y="80" width="1260" height="28" rx="6" fill="#FAFAFA" stroke="#E0E0E0"/>
  <line x1="88" y1="94" x2="118" y2="94" stroke="#5F6368" stroke-width="2.4"/>
  <text x="126" y="99" font-size="11.5" fill="#5F6368">主干前进</text>
  <line x1="222" y1="94" x2="252" y2="94" stroke="#EF6C00" stroke-width="2.4"/>
  <text x="260" y="99" font-size="11.5" fill="#EF6C00">① 执行器在等 → 进下排</text>
  <line x1="486" y1="94" x2="516" y2="94" stroke="#2E7D32" stroke-width="2.4"/>
  <text x="524" y="99" font-size="11.5" fill="#2E7D32">② 试答答得上 → 回执行器重跑</text>
  <line x1="762" y1="94" x2="792" y2="94" stroke="#1565C0" stroke-width="2.4"/>
  <text x="800" y="99" font-size="11.5" fill="#1565C0">③ 用户答复 → <tspan font-weight="600">直接回执行器（不经主 agent）</tspan></text>

  <text x="60" y="132" font-size="13" font-weight="700" fill="#616161">主干（一次 invoke）</text>

  <!-- ═══════════ 上排：主干 ═══════════ -->
  <rect x="60" y="140" width="1280" height="240" rx="12" fill="#FCFCFC" stroke="#E0E0E0" stroke-width="1.2"/>

  <rect x="80" y="190" width="130" height="56" rx="26" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.8"/>
  <text x="145" y="214" text-anchor="middle" font-size="13" font-weight="600" fill="#174EA6">用户提问</text>
  <text x="145" y="232" text-anchor="middle" font-size="9" fill="#1565C0">一次 invoke 的起点</text>
  <line x1="212" y1="218" x2="232" y2="218" stroke="#5F6368" stroke-width="1.8" marker-end="url(#a)"/>

  <rect x="234" y="190" width="130" height="56" rx="8" fill="#E8F5E9" stroke="#43A047" stroke-width="1.6"/>
  <text x="299" y="214" text-anchor="middle" font-size="12" fill="#1B5E20">prepare 🔒</text>
  <text x="299" y="232" text-anchor="middle" font-size="9" fill="#2E7D32">建 / 更新任务台账</text>
  <line x1="366" y1="218" x2="386" y2="218" stroke="#5F6368" stroke-width="1.8" marker-end="url(#a)"/>

  <rect x="388" y="190" width="130" height="56" rx="8" fill="#FFF8F0" stroke="#FB8C00" stroke-width="2" stroke-dasharray="7 4"/>
  <text x="453" y="214" text-anchor="middle" font-size="12" font-weight="600" fill="#E65100">主 agent 🧠</text>
  <text x="453" y="232" text-anchor="middle" font-size="9" fill="#8D6E63">三条出路自己选</text>
  <line x1="520" y1="218" x2="540" y2="218" stroke="#5F6368" stroke-width="1.8" marker-end="url(#a)"/>

  <rect x="542" y="190" width="130" height="56" rx="8" fill="#F1F8E9" stroke="#7CB342" stroke-width="1.8"/>
  <text x="607" y="214" text-anchor="middle" font-size="12" fill="#33691E">delegate 🔒</text>
  <text x="607" y="232" text-anchor="middle" font-size="9" fill="#33691E">试答 → 建 Task → 派发</text>
  <line x1="674" y1="218" x2="694" y2="218" stroke="#5F6368" stroke-width="1.8" marker-end="url(#a)"/>

  <rect x="696" y="190" width="390" height="56" rx="8" fill="#E8F5E9" stroke="#43A047" stroke-width="2"/>
  <text x="891" y="208" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1B5E20">执行器：干活 → 交付产物 / ask_user 要信息（最多 3 轮）</text>
  <text x="891" y="226" text-anchor="middle" font-size="10" fill="#2E7D32">每次收到交接书〔任务＋用户原话＋历次问答＋产物清单〕</text>
  <text x="891" y="241" text-anchor="middle" font-size="10" fill="#2E7D32">平台按结构算三态：没交也没申报 → 推回去〔点明两条出路〕</text>
  <line x1="1088" y1="218" x2="1108" y2="218" stroke="#5F6368" stroke-width="1.8" marker-end="url(#a)"/>

  <rect x="1110" y="190" width="120" height="56" rx="8" fill="#E8F5E9" stroke="#43A047" stroke-width="1.6"/>
  <text x="1170" y="214" text-anchor="middle" font-size="12" fill="#1B5E20">finalize 🔒</text>
  <text x="1170" y="232" text-anchor="middle" font-size="9" fill="#2E7D32">决定回给用户什么</text>
  <line x1="1232" y1="218" x2="1252" y2="218" stroke="#5F6368" stroke-width="1.8" marker-end="url(#a)"/>

  <rect x="1254" y="190" width="70" height="56" rx="8" fill="#F3E5F5" stroke="#8E24AA" stroke-width="1.6"/>
  <text x="1289" y="223" text-anchor="middle" font-size="12" fill="#4A148C">END</text>

  <!-- 三态分派（执行器的扇出，紧贴其下） -->
  <!-- 汇流线：三态各自上行 → 汇成一条总线 → 从 delegate 的工具返回口回到主 agent -->
  <path d="M 607 268 L 1080 268" fill="none" stroke="#5F6368" stroke-width="1.6" stroke-dasharray="6 4"/>
  <path d="M 607 268 L 607 250" fill="none" stroke="#5F6368" stroke-width="1.6" marker-end="url(#a)"/>
  <path d="M 720 286 L 720 268" fill="none" stroke="#5F6368" stroke-width="1.6" stroke-dasharray="6 4"/>
  <path d="M 900 286 L 900 268" fill="none" stroke="#5F6368" stroke-width="1.6" stroke-dasharray="6 4"/>
  <path d="M 1080 286 L 1080 268" fill="none" stroke="#5F6368" stroke-width="1.6" stroke-dasharray="6 4"/>
  <text x="80" y="272" font-size="10.5" fill="#616161">平台按结构定三态后 —— 三态各自包成一条 <tspan font-weight="600">ToolMessage</tspan>，从 delegate 的工具返回口<tspan font-weight="600">回到主 agent</tspan>：</text>

  <rect x="640" y="290" width="160" height="38" rx="7" fill="#E8F5E9" stroke="#43A047" stroke-width="1.5"/>
  <text x="720" y="308" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1B5E20">completed</text>
  <text x="720" y="322" text-anchor="middle" font-size="9.5" fill="#2E7D32">→ 已交付 art_00X ＋ 路径</text>

  <rect x="820" y="290" width="160" height="38" rx="7" fill="#FFFDE7" stroke="#FBC02D" stroke-width="1.8"/>
  <text x="900" y="308" text-anchor="middle" font-size="11.5" font-weight="600" fill="#F57F17">waiting_for_input</text>
  <text x="900" y="322" text-anchor="middle" font-size="9.5" fill="#5F6368">→ 平台登记待答 ＋ ① 进下排</text>

  <rect x="1000" y="290" width="160" height="38" rx="7" fill="#FFEBEE" stroke="#E53935" stroke-width="1.5"/>
  <text x="1080" y="308" text-anchor="middle" font-size="11.5" font-weight="600" fill="#B71C1C">incomplete ×3</text>
  <text x="1080" y="322" text-anchor="middle" font-size="9.5" fill="#5F6368">→ failed（跑了 N 轮仍没完成）</text>

  <text x="80" y="358" font-size="10.5" fill="#757575">三条出路里的「直接答 / 自己产出」不建 Task，跳过 delegate 直达 finalize（本图只画委派那条）</text>

  <!-- ═══════════ 三条连接线，各走各的道 ═══════════ -->
  <!-- ① 去程：waiting → 下排试答（走中段通道） -->
  <path d="M 900 328 L 900 410 L 200 410 L 200 498" fill="none" stroke="#EF6C00" stroke-width="2.2" marker-end="url(#aO)"/>
  <text x="550" y="402" text-anchor="middle" font-size="11" font-weight="600" fill="#EF6C00">① 执行器缺信息 → 问题交给平台去处理（主 agent 不再参与）</text>

  <!-- ② 回程：试答答得上 → 执行器（走左边距 + 上沿通道） -->
  <path d="M 70 526 L 36 526 L 36 158 L 780 158 L 780 188" fill="none" stroke="#2E7D32" stroke-width="2.2" marker-end="url(#aG)"/>
  <text x="408" y="176" text-anchor="middle" font-size="11" font-weight="600" fill="#2E7D32">② 试答答得上 → 〔主 agent 补充〕标来源后写进交接书，执行器重跑</text>

  <!-- ③ 回程：答复投递 → 执行器（走右边距 + 上沿通道，绕开 END 框） -->
  <path d="M 1332 526 L 1360 526 L 1360 176 L 1000 176 L 1000 188" fill="none" stroke="#1565C0" stroke-width="2.4" marker-end="url(#aB)"/>
  <text x="1180" y="166" text-anchor="middle" font-size="11" font-weight="600" fill="#1565C0">③ 答复直接投回执行器（不经主 agent）</text>

  <!-- ═══════════ 下排：「待答」的一生 ═══════════ -->
  <rect x="60" y="460" width="1280" height="160" rx="12" fill="#FFFDF5" stroke="#FBC02D" stroke-width="1.4"/>
  <text x="70" y="482" font-size="12.5" font-weight="700" fill="#F57F17">「待答」的一生</text>

  <rect x="70" y="500" width="180" height="52" rx="8" fill="#FFF8F0" stroke="#FB8C00" stroke-width="2" stroke-dasharray="7 4"/>
  <text x="160" y="518" text-anchor="middle" font-size="11.5" font-weight="700" fill="#E65100">(4) 强制试答 🧠</text>
  <text x="160" y="534" text-anchor="middle" font-size="9" fill="#8D6E63">〔能力名＋任务＋它要的信息</text>
  <text x="160" y="546" text-anchor="middle" font-size="9" fill="#8D6E63">＋全部消息（全文，不截）〕</text>

  <line x1="252" y1="526" x2="270" y2="526" stroke="#5F6368" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="261" y="493" text-anchor="middle" font-size="9.5" font-weight="600" fill="#C62828">答不上</text>
  <rect x="272" y="500" width="170" height="52" rx="8" fill="#FFFDE7" stroke="#FBC02D" stroke-width="1.8"/>
  <text x="357" y="520" text-anchor="middle" font-size="11.5" font-weight="600" fill="#F57F17">登记待答</text>
  <text x="357" y="538" text-anchor="middle" font-size="9" fill="#5F6368">Task.stage =</text>
  <text x="357" y="549" text-anchor="middle" font-size="9" fill="#5F6368">waiting_for_input</text>

  <line x1="444" y1="526" x2="462" y2="526" stroke="#5F6368" stroke-width="1.6" marker-end="url(#a)"/>
  <rect x="464" y="500" width="190" height="52" rx="8" fill="#E8F5E9" stroke="#43A047" stroke-width="1.6"/>
  <text x="559" y="520" text-anchor="middle" font-size="11" fill="#1B5E20">finalize 🔒 原样贴出</text>
  <text x="559" y="538" text-anchor="middle" font-size="9" fill="#5F6368">〔执行器原话〕无条件，不判断</text>

  <line x1="656" y1="526" x2="674" y2="526" stroke="#5F6368" stroke-width="1.6" marker-end="url(#a)"/>
  <rect x="676" y="500" width="150" height="52" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.6"/>
  <text x="751" y="520" text-anchor="middle" font-size="11.5" font-weight="600" fill="#174EA6">★ 用户看到</text>
  <text x="751" y="538" text-anchor="middle" font-size="9" fill="#1565C0">执行器说的话</text>

  <line x1="828" y1="526" x2="846" y2="526" stroke="#5F6368" stroke-width="1.6" marker-end="url(#a)"/>
  <rect x="848" y="500" width="150" height="52" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.6"/>
  <text x="923" y="520" text-anchor="middle" font-size="11.5" font-weight="600" fill="#174EA6">★ 用户答复</text>
  <text x="923" y="538" text-anchor="middle" font-size="9" fill="#1565C0">下一次 invoke</text>

  <line x1="1000" y1="526" x2="1018" y2="526" stroke="#1565C0" stroke-width="2.2" marker-end="url(#aB)"/>
  <rect x="1020" y="500" width="180" height="52" rx="8" fill="#E8F5E9" stroke="#43A047" stroke-width="1.6"/>
  <text x="1110" y="520" text-anchor="middle" font-size="11" fill="#1B5E20">prepare 🔒 投递原话</text>
  <text x="1110" y="538" text-anchor="middle" font-size="9" fill="#5F6368">〔原话 ＋ 它问的那句 → 交接书〕</text>

  <line x1="1202" y1="526" x2="1220" y2="526" stroke="#1565C0" stroke-width="2.2" marker-end="url(#aB)"/>
  <rect x="1222" y="500" width="110" height="52" rx="8" fill="#E3F2FD" stroke="#1565C0" stroke-width="2"/>
  <text x="1277" y="520" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0D47A1">★ 进执行器</text>
  <text x="1277" y="538" text-anchor="middle" font-size="9" fill="#1565C0">答复不经它转达</text>

  <text x="70" y="582" font-size="10.5" fill="#8D6E63">执行器<tspan font-weight="600">用完即弃</tspan>：每次投递都是一次全新的 run_task —— 平台必须把「这件事的全部已知」重新交给它（下排每个框里的〔〕就是那一次交接的内容），见 message-flow.svg</text>

  <!-- 底注 -->
  <rect x="60" y="640" width="1280" height="90" rx="10" fill="#F1F8E9" stroke="#7CB342" stroke-width="1.4"/>
  <text x="80" y="666" font-size="12" font-weight="700" fill="#33691E">🔑 这一圈里有三处是平台代码（🔒）保证的，LLM 跳不过：</text>
  <text x="80" y="690" font-size="11.5" fill="#558B2F">① <tspan font-weight="600">试答是强制的</tspan> —— 在 delegate 工具内部，主 agent 想跳过也跳不过　② <tspan font-weight="600">待答不丢</tspan> —— finalize 无条件把执行器原话贴出去（原来是 LLM 判断「问出去了没」，已删）</text>
  <text x="80" y="712" font-size="11.5" fill="#558B2F">③ <tspan font-weight="600">答复直达执行器</tspan> —— 平台投递，不靠主 agent 转达；主 agent 只是从台账里知道「任务状态变了」</text>
</svg>
