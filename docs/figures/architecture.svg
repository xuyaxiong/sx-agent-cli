<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1240" width="1400" height="1240" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5F6368"/>
    </marker>
    <marker id="arwG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#43A047"/>
    </marker>
  </defs>

  <rect width="1400" height="1240" fill="#FFFFFF"/>
  <text x="700" y="44" text-anchor="middle" font-size="27" font-weight="700" fill="#202124">多 Skill Agent 架构总览</text>
  <text x="700" y="72" text-anchor="middle" font-size="14" fill="#5F6368">Skill（专业能力） · Task（具体业务工作） · Sub Agent（可选执行者） —— 三者正交　｜　依据 docs/architecture-diagram.md</text>

  <!-- 图例 -->
  <rect x="60" y="90" width="920" height="30" rx="6" fill="#FAFAFA" stroke="#E0E0E0"/>
  <line x1="80" y1="105" x2="112" y2="105" stroke="#43A047" stroke-width="2.6"/>
  <text x="120" y="110" font-size="12.5" fill="#2E7D32">🔒 平台代码保证（硬）</text>
  <line x1="300" y1="105" x2="332" y2="105" stroke="#F9A825" stroke-width="2.6" stroke-dasharray="6 4"/>
  <text x="340" y="110" font-size="12.5" fill="#F57F17">🧠 LLM 决策（软）</text>
  <text x="540" y="110" font-size="12.5" fill="#5F6368">灰色箭头＝数据流　｜　绿箭头＝产物落库</text>

  <!-- ═══════════ ① Skill ═══════════ -->
  <rect x="60" y="136" width="920" height="104" rx="12" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.8"/>
  <text x="84" y="164" font-size="17.5" font-weight="700" fill="#174EA6">① Skill —— 技能包（静态 · 一个文件夹）</text>
  <text x="84" y="188" font-size="12.5" fill="#174EA6">lesson-prep/　├── SKILL.md（入口，<tspan font-weight="600">只有这一个名字</tspan>）　├── references/　└── assets/</text>
  <text x="84" y="210" font-size="12.5" fill="#174EA6">渐进式披露三层：name+description（常驻） → SKILL.md 全文（read_skill） → 自带文件全文（read_skill_file）</text>
  <text x="84" y="231" font-size="12" fill="#C62828">⚠️ 无参数声明 · 无交付物声明 · 无结果协议 · 无完成条件 —— 平台对作者零强制约束</text>
  <line x1="520" y1="240" x2="520" y2="286" stroke="#5F6368" stroke-width="1.8" marker-end="url(#arw)"/>
  <text x="534" y="268" font-size="12" fill="#5F6368">平台把能力清单注入系统提示 —— 只给 name + description</text>

  <!-- ═══════════ ② 主 agent ═══════════ -->
  <rect x="60" y="290" width="920" height="212" rx="14" fill="#FFF8F0" stroke="#FB8C00" stroke-width="2" stroke-dasharray="7 4"/>
  <text x="84" y="318" font-size="19" font-weight="700" fill="#E65100">② 主 Agent —— 一个完整的 Agent（🧠 软）</text>
  <text x="84" y="340" font-size="12.5" fill="#8D6E63">自己的工具 + 自己的循环。<tspan font-weight="600">六个软选择由它定</tspan>：要不要委派 · 派给哪个技能 · 产出范围 · task 怎么写 · 点名哪几轮 · 回复怎么组织</text>

  <rect x="84" y="356" width="264" height="86" rx="10" fill="#FFFFFF" stroke="#FFB74D" stroke-width="1.4"/>
  <text x="216" y="382" text-anchor="middle" font-size="15" font-weight="600" fill="#E65100">直接回答</text>
  <text x="216" y="404" text-anchor="middle" font-size="12" fill="#5F6368">闲聊 / 追问 / 澄清</text>
  <text x="216" y="428" text-anchor="middle" font-size="12" font-weight="600" fill="#43A047">不建 Task</text>

  <rect x="366" y="356" width="264" height="86" rx="10" fill="#FFFFFF" stroke="#FFB74D" stroke-width="1.4"/>
  <text x="498" y="382" text-anchor="middle" font-size="15" font-weight="600" fill="#E65100">自己产出</text>
  <text x="498" y="404" text-anchor="middle" font-size="12" fill="#5F6368">短内容 → write_artifact</text>
  <text x="498" y="428" text-anchor="middle" font-size="12" font-weight="600" fill="#43A047">不建 Task</text>

  <rect x="648" y="356" width="308" height="86" rx="10" fill="#FFFFFF" stroke="#FB8C00" stroke-width="2.2"/>
  <text x="802" y="382" text-anchor="middle" font-size="15" font-weight="600" fill="#E65100">委派执行</text>
  <text x="802" y="404" text-anchor="middle" font-size="12" fill="#5F6368">需要专业能力时</text>
  <text x="802" y="428" text-anchor="middle" font-size="12" font-weight="600" fill="#C62828">建 Task</text>

  <text x="84" y="466" font-size="12" fill="#8D6E63">🔒 工具集由 <tspan font-weight="600">EXEC_PATH</tspan> 决定：auto 六个（默认）· delegate 只剩 2 个（强制委派）· inline 去掉 delegate（强制自己干）</text>
  <text x="84" y="487" font-size="12" fill="#8D6E63">🔒 上下文里还常驻着：<tspan font-weight="600">【平台提示】任务台账</tspan>（prepare 注入，只提供事实、不替它做决定）</text>

  <line x1="802" y1="502" x2="802" y2="548" stroke="#5F6368" stroke-width="1.8" marker-end="url(#arw)"/>
  <text x="788" y="530" text-anchor="end" font-size="12" fill="#5F6368">delegate(skill_name, task, artifacts, based_on_turns)</text>

  <!-- ═══════════ ③ delegate 内部 ═══════════ -->
  <rect x="60" y="552" width="920" height="246" rx="14" fill="#F1F8E9" stroke="#7CB342" stroke-width="2"/>
  <text x="84" y="580" font-size="17.5" font-weight="700" fill="#33691E">③ delegate 内部 —— 🔒 平台代码保证（LLM 跳不过）</text>

  <rect x="84" y="594" width="212" height="74" rx="8" fill="#FFFFFF" stroke="#AED581" stroke-width="1.4"/>
  <text x="190" y="618" text-anchor="middle" font-size="12.5" font-weight="600" fill="#33691E">(1) 三处当场校验</text>
  <text x="190" y="638" text-anchor="middle" font-size="11" fill="#5F6368">技能名 · 产物 ID · 轮次</text>
  <text x="190" y="656" text-anchor="middle" font-size="11" fill="#5F6368">不存在 → 拒绝派发</text>

  <rect x="312" y="594" width="212" height="74" rx="8" fill="#FFFFFF" stroke="#AED581" stroke-width="1.4"/>
  <text x="418" y="618" text-anchor="middle" font-size="12.5" font-weight="600" fill="#33691E">(2) 清掉旧账</text>
  <text x="418" y="638" text-anchor="middle" font-size="11" fill="#5F6368">上次失败的 → 标成</text>
  <text x="418" y="656" text-anchor="middle" font-size="11" fill="#5F6368">「不用管了」，不再挂台账</text>

  <rect x="540" y="594" width="212" height="74" rx="8" fill="#FFFFFF" stroke="#AED581" stroke-width="1.4"/>
  <text x="646" y="618" text-anchor="middle" font-size="12.5" font-weight="600" fill="#33691E">(3) 交接书 → 执行器</text>
  <text x="646" y="638" text-anchor="middle" font-size="11" fill="#5F6368">【任务】【用户原话】</text>
  <text x="646" y="656" text-anchor="middle" font-size="11" fill="#5F6368">【上次说到哪】【答复】…</text>

  <rect x="768" y="594" width="188" height="74" rx="8" fill="#FFF8F0" stroke="#FFB74D" stroke-width="1.8" stroke-dasharray="6 4"/>
  <text x="862" y="618" text-anchor="middle" font-size="12.5" font-weight="600" fill="#E65100">(4) 强制试答 🧠</text>
  <text x="862" y="638" text-anchor="middle" font-size="11" fill="#8D6E63">答得上 → 带补充重跑</text>
  <text x="862" y="656" text-anchor="middle" font-size="11" fill="#8D6E63">答不上 → 交给用户</text>

  <text x="84" y="694" font-size="12.5" font-weight="600" fill="#33691E">(5) 三态穷举分派（没有第四种）：</text>
  <rect x="84" y="704" width="290" height="78" rx="8" fill="#E8F5E9" stroke="#43A047" stroke-width="1.6"/>
  <text x="229" y="728" text-anchor="middle" font-size="13" font-weight="600" fill="#1B5E20">completed → 交付</text>
  <text x="229" y="750" text-anchor="middle" font-size="11" fill="#2E7D32">主 agent 拿到：产物 ID + 摘要</text>
  <text x="229" y="770" text-anchor="middle" font-size="11" font-weight="600" fill="#2E7D32">＋ 文件路径（平台顺路带上去）</text>

  <rect x="390" y="704" width="290" height="78" rx="8" fill="#FFFDE7" stroke="#FBC02D" stroke-width="1.8"/>
  <text x="535" y="728" text-anchor="middle" font-size="13" font-weight="600" fill="#F57F17">waiting_for_input → 登记待答</text>
  <text x="535" y="750" text-anchor="middle" font-size="11" fill="#5F6368">平台负责<tspan font-weight="600">转达</tspan>给用户</text>
  <text x="535" y="770" text-anchor="middle" font-size="11" fill="#5F6368">也负责把答复<tspan font-weight="600">投回去</tspan></text>

  <rect x="696" y="704" width="260" height="78" rx="8" fill="#FFEBEE" stroke="#E53935" stroke-width="1.6"/>
  <text x="826" y="728" text-anchor="middle" font-size="13" font-weight="600" fill="#B71C1C">incomplete（推满 3 轮）</text>
  <text x="826" y="750" text-anchor="middle" font-size="11" fill="#5F6368">→ failed，交给主 agent</text>
  <text x="826" y="770" text-anchor="middle" font-size="11" fill="#5F6368">（带上进度 / 还缺什么）</text>

  <line x1="520" y1="798" x2="520" y2="846" stroke="#5F6368" stroke-width="1.8" marker-end="url(#arw)"/>

  <!-- ═══════════ ④ Sub Agent ═══════════ -->
  <rect x="60" y="850" width="920" height="152" rx="12" fill="#E8F5E9" stroke="#43A047" stroke-width="2"/>
  <text x="700" y="878" text-anchor="middle" font-size="17" font-weight="700" fill="#1B5E20">④ Sub Agent —— 执行器（隔离上下文 · 用完即弃 · 不绑任何 skill）</text>
  <text x="700" y="902" text-anchor="middle" font-size="12.5" fill="#2E7D32">工具箱：write_artifact · read_artifact · read_skill_file · read_user_turn（按需）</text>
  <text x="700" y="926" text-anchor="middle" font-size="12.5" fill="#8D6E63">🧠 它自己的循环：怎么干 / 要不要落库 / 缺什么信息 —— 这些是它的自由</text>
  <rect x="240" y="940" width="400" height="48" rx="8" fill="#FFFFFF" stroke="#66BB6A" stroke-width="1.4"/>
  <text x="440" y="962" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1B5E20">🔒 出口限制：最多 3 轮 react</text>
  <text x="440" y="980" text-anchor="middle" font-size="11" fill="#5F6368">每轮都判三态；incomplete 就推回去，推满才交出去</text>

  <line x1="520" y1="1002" x2="520" y2="1046" stroke="#43A047" stroke-width="1.8" marker-end="url(#arwG)"/>

  <!-- ═══════════ ⑤ 产物库 ═══════════ -->
  <rect x="60" y="1050" width="920" height="150" rx="12" fill="#F3E5F5" stroke="#8E24AA" stroke-width="2"/>
  <text x="520" y="1078" text-anchor="middle" font-size="17" font-weight="700" fill="#4A148C">⑤ 产物库 —— 平台<tspan font-weight="600">唯一保证</tspan>的交付物</text>
  <text x="520" y="1102" text-anchor="middle" font-size="12.5" fill="#6A1B9A">🔒 落库（当场写盘） · 真实路径 · <tspan font-weight="600">跨轮累积</tspan> · 判定可见 · 可以有多个</text>
  <text x="520" y="1126" text-anchor="middle" font-size="12.5" fill="#6A1B9A">7 个字段：title / summary / content / type / ext / file / path</text>
  <rect x="180" y="1140" width="680" height="46" rx="8" fill="#FFEBEE" stroke="#E53935" stroke-width="1.4"/>
  <text x="520" y="1160" text-anchor="middle" font-size="12" font-weight="600" fill="#B71C1C">⚠️ 写在回复正文里的（协议块那类）：平台不解析 · 不校验 · 不抽取 · 不累积</text>
  <text x="520" y="1178" text-anchor="middle" font-size="11" fill="#5F6368">能走通就走通；碎了、丢了都可能 —— 要保证就走产物</text>

  <!-- ═══════════ 右侧：核心收益 ═══════════ -->
  <rect x="1004" y="90" width="336" height="1110" rx="12" fill="#F1F8E9" stroke="#7CB342" stroke-width="1.6"/>
  <text x="1172" y="122" text-anchor="middle" font-size="16" font-weight="700" fill="#33691E">核心收益</text>
  <line x1="1026" y1="136" x2="1318" y2="136" stroke="#AED581"/>

  <text x="1026" y="168" font-size="13" font-weight="600" fill="#33691E">✓ 不重复问参数</text>
  <text x="1026" y="190" font-size="11.5" fill="#558B2F">执行器拿的是<tspan font-weight="600">整份交接书</tspan></text>
  <text x="1026" y="208" font-size="11.5" fill="#558B2F">（含历次答复，累积不覆盖）</text>

  <text x="1026" y="244" font-size="13" font-weight="600" fill="#33691E">✓ 不从头重开</text>
  <text x="1026" y="266" font-size="11.5" fill="#558B2F">Task 承载状态，跨轮存活</text>
  <text x="1026" y="284" font-size="11.5" fill="#558B2F">执行器用完即弃 —— 重入无害</text>

  <text x="1026" y="320" font-size="13" font-weight="600" fill="#33691E">✓ 提问走向确定</text>
  <text x="1026" y="342" font-size="11.5" fill="#558B2F">问题由<tspan font-weight="600">平台</tspan>转达（不是主 agent）</text>
  <text x="1026" y="360" font-size="11.5" fill="#558B2F">答复由<tspan font-weight="600">平台</tspan>投回 —— 没有"答给谁"的歧义</text>

  <text x="1026" y="396" font-size="13" font-weight="600" fill="#33691E">✓ 上下文不爆炸</text>
  <text x="1026" y="418" font-size="11.5" fill="#558B2F">产物正文只在产物库</text>
  <text x="1026" y="436" font-size="11.5" fill="#558B2F">主 agent 只拿 ID + 摘要 + 路径</text>

  <text x="1026" y="472" font-size="13" font-weight="600" fill="#33691E">✓ 加技能不动平台</text>
  <text x="1026" y="494" font-size="11.5" fill="#558B2F">执行器通用、不绑 skill</text>
  <text x="1026" y="512" font-size="11.5" fill="#558B2F">加一个技能包 = 丢一个文件夹</text>

  <text x="1026" y="548" font-size="13" font-weight="600" fill="#33691E">✓ 完成判定准</text>
  <text x="1026" y="570" font-size="11.5" fill="#558B2F">问「任务完成了没」</text>
  <text x="1026" y="588" font-size="11.5" fill="#558B2F">不是「产物生成了没」——产物只是证据之一</text>

  <line x1="1026" y1="612" x2="1318" y2="612" stroke="#AED581"/>
  <text x="1026" y="640" font-size="13" font-weight="600" fill="#33691E">实测数据</text>
  <text x="1026" y="664" font-size="11.5" fill="#558B2F">· 48k 字课件，主上下文只占 2.6k 字</text>
  <text x="1026" y="686" font-size="11.5" fill="#558B2F">· 强制委派跑真技能：主上下文 5.9k 字</text>
  <text x="1026" y="708" font-size="11.5" fill="#558B2F">　（同一任务，主 agent 自己干要 72k）</text>

  <line x1="1026" y1="732" x2="1318" y2="732" stroke="#AED581"/>
  <text x="1026" y="760" font-size="13" font-weight="600" fill="#33691E">平台强制（🔒 12+ 条）</text>
  <text x="1026" y="784" font-size="11.5" fill="#558B2F">· 产物必须真实存在且是这次新写的</text>
  <text x="1026" y="804" font-size="11.5" fill="#558B2F">· 三态穷举分派，状态由代码写</text>
  <text x="1026" y="824" font-size="11.5" fill="#558B2F">· 待答不丢（finalize 无条件透传）</text>
  <text x="1026" y="844" font-size="11.5" fill="#558B2F">· 并行不互相覆盖（按 id 合并）</text>
  <text x="1026" y="864" font-size="11.5" fill="#558B2F">· 引用了不存在的东西 → 当场拒绝</text>

  <line x1="1026" y1="888" x2="1318" y2="888" stroke="#AED581"/>
  <text x="1026" y="916" font-size="13" font-weight="600" fill="#33691E">交给 LLM 的（🧠）</text>
  <text x="1026" y="940" font-size="11.5" fill="#558B2F">· 三态判定（任务完成了没）</text>
  <text x="1026" y="960" font-size="11.5" fill="#558B2F">· 主 agent 试答（上下文里有没有）</text>
  <text x="1026" y="980" font-size="11.5" fill="#558B2F">· 主 agent / 执行器自己的循环</text>
  <text x="1026" y="1008" font-size="11.5" font-weight="600" fill="#F57F17">软判断只剩这几处 —— 且每一处的</text>
  <text x="1026" y="1026" font-size="11.5" font-weight="600" fill="#F57F17"><tspan font-weight="600">输入都由代码取全</tspan>（缺一不可）</text>

  <line x1="1026" y1="1050" x2="1318" y2="1050" stroke="#AED581"/>
  <text x="1026" y="1078" font-size="13" font-weight="600" fill="#33691E">一句话</text>
  <text x="1026" y="1102" font-size="11.5" fill="#558B2F">平台管机制，skill 管业务；</text>
  <text x="1026" y="1122" font-size="11.5" fill="#558B2F">交接靠硬拼，软判断收紧到最紧；</text>
  <text x="1026" y="1142" font-size="11.5" fill="#558B2F">要保真的交付物 —— 走产物。</text>
</svg>
